name: KsefWidget
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SnapshotProbe:
    type: tool
    platform: macOS
    sources: [Probe, Shared/Snapshot.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ksef-daily-fetch.SnapshotProbe
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES   # a sandboxed CLI without an embedded CFBundleIdentifier dies with SIGTRAP
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
  KsefWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
  KsefCore:
    type: library.static
    platform: macOS
    sources: [Core]
  KsefCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CoreTests
        excludes: ["Fixtures/**"]
    dependencies:
      - target: KsefCore
  KsefE2ETests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: E2ETests
        excludes: ["Fixtures/**"]
      - CoreTests/Support/TestCredentials.swift
      - CoreTests/Support/RandomNip.swift
      - CoreTests/Support/Fixtures.swift
      - CoreTests/Support/TestClock.swift
    dependencies:
      - target: KsefCore
  KsefAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests, App/SettingsView.swift]
    dependencies:
      - target: KsefCore
  KsefWidget:
    type: application
    platform: macOS
    sources: [App, Shared/KsefLink.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ksef-daily-fetch.KsefWidget
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: KSeF
        PRODUCT_NAME: KSeF
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO   # no get-task-allow: nothing may attach to the app and read the key password
    dependencies:
      - target: KsefCore
      - target: KsefWidgetExtension
  KsefWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes: ["Info.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ksef-daily-fetch.KsefWidget.Extension
        INFOPLIST_FILE: Extension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: KSeF
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
